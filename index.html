<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VR TARGET RUSH</title>
<meta name="description" content="空中に浮かぶ的を0.25秒見つめて撃つ、30秒のVR射的ゲーム。">
<style>
.a-enter-vr,.a-enter-ar,[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:#233747;font-family:system-ui,sans-serif;color:#eff5f5}
#welcome{position:fixed;inset:0;z-index:5;display:grid;place-items:safe center;overflow:auto;padding:20px;background:white;color:#233747}
article{width:min(100%,520px);padding:24px;text-align:center}
h1{font-size:clamp(32px,7vw,54px);line-height:1;margin:0 0 18px}
#status{line-height:1.6;margin:16px 0 0}
button{border:1px solid #d5deda;border-radius:4px;padding:10px 22px;font:700 16px system-ui;background:#f2e5c9;color:#273946;cursor:pointer}
button:disabled{opacity:.5}
#back{position:fixed;z-index:3;top:8px;left:8px;display:none;width:38px;height:36px;padding:9px;background:#233747;color:white}
#back::before{content:"";display:block;width:11px;height:11px;border:solid currentColor;border-width:0 0 2px 2px;transform:rotate(45deg);margin-left:2px}
#divider{display:none;pointer-events:none;position:fixed;inset:0 50%;border-left:2px solid #302820;z-index:2}
body.stereo #divider{display:block}
</style>
<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
<script>
'use strict';
AFRAME.registerComponent('cardboard-view', {
  init() {
    this.enabled = false;
    const stereo = new THREE.StereoCamera();
    stereo.aspect = .5;
    const size = new THREE.Vector2();
    const scene = this.el;

    scene.addEventListener('renderstart', () => {
      const renderer = scene.renderer;
      const render = renderer.render.bind(renderer);
      renderer.render = (world, camera) => {
        if (!this.enabled || camera !== scene.camera) return render(world, camera);

        // Render each eye into its own half of the canvas.
        world.updateMatrixWorld();
        camera.updateMatrixWorld();
        stereo.update(camera);
        renderer.getSize(size);
        const halfWidth = size.x / 2;
        const autoClear = renderer.autoClear;

        renderer.autoClear = false;
        renderer.setScissorTest(false);
        renderer.clear();
        renderer.setScissorTest(true);
        for (const [eye, x] of [[stereo.cameraL, 0], [stereo.cameraR, halfWidth]]) {
          renderer.setScissor(x, 0, halfWidth, size.y);
          renderer.setViewport(x, 0, halfWidth, size.y);
          render(world, eye);
        }
        renderer.setScissorTest(false);
        renderer.setViewport(0, 0, size.x, size.y);
        renderer.autoClear = autoClear;
      };
    });
  }
});
const GAZE_MS = 250;
const FLIGHT_MS = 230;
const ROUND_MS = 30000;
const BREAK_MS = 420;
const TARGET_SETTLE_MS = 150;
const SECTOR_COUNT = 8;
const DEPTHS = [3.45, 5.5, 8.2];
const TARGET_COLORS = ['#cf644c', '#268799', '#dda844'];
AFRAME.registerComponent('rush', {
  init() {
    this.el.addEventListener('loaded', () => this.setup(), {once: true});
  },
  setup() {
    for (const id of ['reticle', 'progress']) {
      document.getElementById(id).getObject3D('mesh').renderOrder = 10000;
    }
    for (const id of ['aim', 'hud', 'timer', 'scoreText', 'result', 'action', 'notice', 'progress', 'camera', 'pellet', 'shards']) {
      this[id] = document.getElementById(id);
    }
    this.state = 'ready';
    this.active = false;
    this.score = 0;
    this.createTargets();
    this.createShards();
    this.resetGaze();
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) this.stopRound();
      else this.resetGaze();
    });
  },
  createTargets() {
    this.slots = [];
    this.targets = [];
    const template = document.getElementById('target-template');
    for (let sector = 0; sector < SECTOR_COUNT; sector++) {
      for (let row = 0; row < 2; row++) {
        for (let column = 0; column < 2; column++) {
          const range = DEPTHS[(sector + row + column) % DEPTHS.length];
          const angle = sector * Math.PI / 4 + (column ? .195 : -.195);
          // Keep the heights visually separated even at different distances.
          const height = 1.6 + range * (row ? .31 : -.12);
          this.slots.push({sector, range, angle, height});
        }
      }
      for (let row = 0; row < 2; row++) {
        const homeSlot = sector * 4 + (row ? 3 : 0);
        const target = template.content.firstElementChild.cloneNode(true);
        const color = TARGET_COLORS[this.targets.length % TARGET_COLORS.length];
        const material = 'shader: flat; color: ' + color;
        target.dataset.color = color;
        target.setAttribute('material', material);
        target.lastElementChild.setAttribute('material', material);
        this.el.appendChild(target);
        this.targets.push({el: target, homeSlot, slot: homeSlot, moving: row === 1});
      }
    }
  },
  resetGaze() {
    if (this.focus) this.progress.setAttribute('theta-length', 0);
    this.focus = null;
    this.since = 0;
  },
  refresh() {
    this.aim.components.raycaster.refreshObjects();
  },
  start(now) {
    this.score = 0;
    this.end = now + ROUND_MS;
    this.state = 'playing';
    this.action.classList.remove('aimable');
    this.action.setAttribute('visible', false);
    this.result.setAttribute('visible', false);
    this.notice.setAttribute('visible', false);
    this.hud.setAttribute('visible', true);
    this.seconds = ROUND_MS / 1000;
    this.timer.setAttribute('value', this.seconds + 's');
    this.scoreText.setAttribute('value', '0');
    for (const target of this.targets) this.showTarget(target, target.homeSlot, now);
    this.refresh();
  },
  stopRound() {
    if (this.state === 'playing') {
      this.finish(false);
    } else {
      this.cancelFlight();
      this.resetGaze();
    }
  },
  finish(timeUp = true) {
    this.cancelFlight();
    this.state = 'result';
    this.targets.forEach(target => {
      target.el.classList.remove('aimable');
      target.el.setAttribute('visible', false);
    });
    this.breakStarted = null;
    this.shards.setAttribute('visible', false);
    this.hud.setAttribute('visible', false);
    this.notice.setAttribute('visible', timeUp);
    this.result.setAttribute('value', String(this.score));
    this.result.setAttribute('visible', true);
    const cam = this.camera.object3D;
    cam.updateWorldMatrix(true, false);
    this.action.object3D.position.set(0, -.55, -3.1).applyMatrix4(cam.matrixWorld);
    this.action.object3D.scale.setScalar(.78);
    cam.getWorldQuaternion(this.action.object3D.quaternion);
    this.action.setAttribute('visible', true);
    this.action.classList.add('aimable');
    this.resetGaze();
    this.refresh();
  },
  createShards() {
    const group = new THREE.Group();
    this.shardColor = new THREE.MeshBasicMaterial({side: THREE.DoubleSide});
    const cream = new THREE.MeshBasicMaterial({color: '#f2e4c5', side: THREE.DoubleSide});
    this.fragments = [];
    const size = Math.PI / 3;
    for (let index = 0; index < 6; index++) {
      const piece = new THREE.Group();
      const angle = index * size;
      [.44, .34, .16].forEach((radius, layer) => {
        const geometry = new THREE.CircleGeometry(radius, 6, angle, size - .025);
        const mesh = new THREE.Mesh(geometry, layer === 1 ? cream : this.shardColor);
        mesh.position.z = layer * .009;
        piece.add(mesh);
      });
      this.fragments.push({piece, angle: angle + size / 2});
      group.add(piece);
    }
    this.shards.setObject3D('fragments', group);
  },
  beginBreak(target, now) {
    const origin = this.shards.object3D;
    target.object3D.getWorldPosition(origin.position);
    target.object3D.getWorldQuaternion(origin.quaternion);
    this.shardColor.color.set(target.dataset.color || '#883a32');
    this.breakStarted = now;
    this.animateBreak(now);
    this.shards.setAttribute('visible', true);
  },
  animateBreak(now) {
    if (this.breakStarted == null) return;
    const progress = (now - this.breakStarted) / BREAK_MS;
    if (progress >= 1) {
      this.breakStarted = null;
      this.shards.setAttribute('visible', false);
      return;
    }
    for (const {piece, angle} of this.fragments) {
      const spread = progress * .73;
      piece.position.set(Math.cos(angle) * spread,
        Math.sin(angle) * spread - .65 * progress * progress, progress * .3);
      piece.rotation.set(Math.sin(angle) * progress * 2.2, Math.cos(angle) * progress * 2.6, progress * .35);
      piece.scale.setScalar(1 - progress * .55);
    }
  },
  place(target, now) {
    const slot = this.slots[target.slot];
    const elapsed = (now - target.born) / 1000;
    const phase = elapsed * 1.6 + slot.sector * .7;
    const angle = slot.angle + (target.moving ? .055 * Math.sin(phase) : 0);
    const range = slot.range + (target.moving ? .42 * Math.cos(phase * .75) : 0);
    const y = slot.height + (target.moving ? .18 * Math.sin(phase * .75) : 0);
    const mesh = target.el.object3D;
    mesh.position.set(-range * Math.sin(angle), y, -range * Math.cos(angle));
    mesh.rotation.y = angle;
    mesh.updateMatrixWorld(true);
  },
  spawn(element, now) {
    const target = this.targets.find(candidate => candidate.el === element);
    const oldSector = this.slots[target.slot].sector;
    const taken = new Set(this.targets.map(candidate => candidate.slot));
    const free = [];
    for (let index = 0; index < this.slots.length; index++) {
      if (!taken.has(index)) free.push(index);
    }
    const otherSectors = free.filter(index => this.slots[index].sector !== oldSector);
    const choices = otherSectors.length ? otherSectors : free;
    const slot = choices[Math.floor(Math.random() * choices.length)];
    this.showTarget(target, slot, now, true);
    this.refresh();
  },
  showTarget(target, slot, now, pop = false) {
    const element = target.el;
    target.slot = slot;
    target.born = now;
    this.place(target, now);
    element.removeAttribute('animation__pop');
    element.object3D.scale.setScalar(pop ? .15 : 1);
    if (pop) {
      element.setAttribute('animation__pop', 'property: scale; from: .15 .15 .15; to: 1 1 1; dur: 140; easing: easeOutQuad');
    }
    element.dataset.born = String(now);
    element.setAttribute('visible', true);
    element.classList.add('aimable');
  },
  points(radius) {
    return radius <= .16 ? 10 : radius <= .34 ? 5 : 1;
  },
  shoot(target, point, now) {
    const cam = this.camera.object3D;
    const from = cam.localToWorld(new THREE.Vector3(.16, -.26, -.65));
    const local = target.object3D.worldToLocal(point.clone());
    const score = target === this.action ? 0 : this.points(Math.hypot(local.x, local.y));
    target.classList.remove('aimable');
    this.flight = {target, from, to: point.clone(), score, fired: now};
    this.pellet.object3D.position.copy(from);
    this.pellet.setAttribute('visible', true);
    this.resetGaze();
    this.refresh();
  },
  cancelFlight() {
    if (!this.flight) return;
    if (this.flight.target === this.action) this.action.classList.add('aimable');
    this.flight = null;
    this.pellet.setAttribute('visible', false);
  },
  movePellet(now) {
    const shot = this.flight;
    const progress = Math.min(1, (now - shot.fired) / FLIGHT_MS);
    this.pellet.object3D.position.lerpVectors(shot.from, shot.to, progress);
    if (progress < 1) return;
    this.cancelFlight();
    this.beginBreak(shot.target, now);
    if (shot.target === this.action) {
      this.start(now);
      return;
    }
    this.score += shot.score;
    this.scoreText.setAttribute('value', String(this.score));
    this.spawn(shot.target, now);
  },
  tock() {
    if (!this.active) return;
    const now = performance.now();
    if (this.state === 'playing') {
      if (now >= this.end) {
        this.finish();
        return;
      }
      const seconds = Math.ceil((this.end - now) / 1000);
      if (seconds !== this.seconds) {
        this.seconds = seconds;
        this.timer.setAttribute('value', seconds + 's');
      }
      for (const target of this.targets) {
        if (target.moving && this.flight?.target !== target.el) this.place(target, now);
      }
    }
    this.animateBreak(now);
    if (this.flight) {
      this.movePellet(now);
      return;
    }
    const ray = this.aim.components.raycaster;
    ray.checkIntersections();
    const target = ray.intersectedEls.find(el => el.classList.contains('aimable'));
    if (!target || now - Number(target.dataset.born || 0) < TARGET_SETTLE_MS) {
      this.resetGaze();
      return;
    }
    if (target !== this.focus) {
      this.focus = target;
      this.since = now;
    }
    const elapsed = now - this.since;
    this.progress.setAttribute('theta-length', Math.min(360, 360 * elapsed / GAZE_MS));
    if (elapsed < GAZE_MS) return;
    const hit = ray.getIntersection(target);
    if (hit) this.shoot(target, hit.point, now);
    else this.resetGaze();
  }
});
</script>
</head>
<body>
<div id="welcome">
 <article>
  <h1>VR TARGET RUSH</h1>
  <button id="play" disabled>遊ぶ</button>
  <p id="status" role="status" hidden></p>
 </article>
</div>
<button id="back" aria-label="設定へ戻る"></button><div id="divider"></div>
<template id="target-template">
 <a-circle class="target" visible="false" radius=".44" segments="32">
  <a-circle radius=".34" segments="32" position="0 0 .01" material="shader:flat;color:#f2e4c5"></a-circle>
  <a-circle radius=".16" segments="24" position="0 0 .02"></a-circle>
 </a-circle>
</template>
<a-scene rush cardboard-view vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" renderer="antialias: true; colorManagement: true" background="color: #527580">
 <a-plane rotation="-90 0 0" width="120" height="120" material="shader:flat;color:#314a55"></a-plane>
 <a-entity light="type: ambient; intensity: 1.28"></a-entity>
 <a-entity light="type: directional; intensity: 1.05" position="-3 7 3"></a-entity>
 <a-circle id="action" class="aimable" position="0 1.6 -5.15" radius=".54" material="shader:flat;color:#f4e4c0">
  <a-ring radius-inner=".43" radius-outer=".50" position="0 0 .009" material="shader:flat;color:#883a32"></a-ring>
  <a-circle radius=".15" position="0 0 .02" material="shader:flat;color:#883a32"></a-circle>
 </a-circle>
 <a-sphere id="pellet" radius=".065" segments-width="12" segments-height="8" color="#c1965c" visible="false"></a-sphere>
 <a-entity id="shards" visible="false"></a-entity>
 <a-entity id="camera" camera="near: .05; far: 100; fov: 75" look-controls position="0 1.6 0">
  <a-entity id="hud" position="0 .86 -2" visible="false">
   <a-plane width=".93" height=".16" material="shader:flat;color:#233747"></a-plane>
   <a-text id="timer" value="30s" position="-.23 0 .008" align="center" width="1.9" color="#eff5f5"></a-text>
   <a-ring position=".075 0 .008" radius-inner=".025" radius-outer=".034" material="shader:flat;color:#f2cd79"></a-ring>
   <a-circle position=".075 0 .009" radius=".012" material="shader:flat;color:#f2cd79"></a-circle>
   <a-text id="scoreText" value="0" position=".26 0 .008" align="center" width="1.9" color="#f2cd79"></a-text>
  </a-entity>
  <a-text id="notice" value="TIME UP!" position="0 .66 -1.75" align="center" width="2.25" color="#fff2d2" visible="false"></a-text>
  <a-text id="result" value="0" position="0 .43 -1.75" align="center" width="2.55" color="#f2cd79" visible="false"></a-text>
  <a-entity id="aim" position="0 0 0" cursor="fuse: false; rayOrigin: entity" raycaster="objects: .aimable; interval: 0; far: 20"></a-entity>
  <a-ring id="reticle" position="0 0 -1" radius-inner=".01" radius-outer=".015" material="shader:flat;color:white;depthTest:false;depthWrite:false;transparent:true"></a-ring>
  <a-ring id="progress" position="0 0 -1" radius-inner=".019" radius-outer=".024" theta-length="0" material="shader:flat;color:#ffd05b;depthTest:false;depthWrite:false;transparent:true;opacity:.99"></a-ring>
 </a-entity>
</a-scene>
<script>
const scene = document.querySelector('a-scene');
const statusMessage = document.getElementById('status');
const play = document.getElementById('play');
const back = document.getElementById('back');
const welcome = document.getElementById('welcome');
const mode = new URLSearchParams(location.search).get('mode');
const stereo = mode === 'cardboard' || (mode !== 'normal' && matchMedia('(pointer: coarse)').matches);
function enablePlay() {
  statusMessage.hidden = true;
  play.disabled = false;
}
function showError(message) {
  statusMessage.textContent = message;
  statusMessage.hidden = false;
}
if (scene.hasLoaded) enablePlay();
else scene.addEventListener('loaded', enablePlay, {once: true});
play.onclick = async () => {
  statusMessage.hidden = true;
  play.disabled = true;
  try {
    if (stereo && typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) {
      const permission = await DeviceOrientationEvent.requestPermission();
      if (permission !== 'granted') throw new Error('Permission denied');
      scene.emit('deviceorientationpermissiongranted');
    }
  } catch {
    showError('Cardboardで遊ぶには、Safariで動作・方向センサーを許可してください。');
    play.disabled = false;
    return;
  }
  scene.components['cardboard-view'].enabled = stereo;
  document.body.classList.toggle('stereo', stereo);
  welcome.hidden = true;
  back.style.display = 'block';
  scene.components.rush.active = true;
  if (stereo && document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen().catch(() => {});
  }
};
back.onclick = () => {
  const game = scene.components.rush;
  game.stopRound();
  game.active = false;
  scene.components['cardboard-view'].enabled = false;
  document.body.classList.remove('stereo');
  welcome.hidden = false;
  play.disabled = false;
  back.style.display = 'none';
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
};
setTimeout(() => {
  if (!scene.hasLoaded) showError('読み込めませんでした。通信を確認して再読み込みしてください。');
}, 15000);
</script>
</body></html>
